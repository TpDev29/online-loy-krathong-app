<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลอยกระทงออนไลน์ | Krathong Online</title>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            'water-dark': '#0f172a',
            'water-light': '#1e293b',
            'moon-gold': '#facc15',
            'lotus-pink': '#ec4899',
          }
        }
      }
    }
  </script>
  <style>
    /* Scene */
    .krathong-scene {
      position: relative; overflow: hidden; min-height: clamp(24rem, 60vh, 40rem);
      background: linear-gradient(to bottom,#030712 0%,#0d172e 40%,#1e3a5f 75%);
      border-radius: 0 0 1rem 1rem; z-index: 1;
    }
    /* Moon */
    .moon { position:absolute; top:5%; right:15%; width:60px; height:60px; border-radius:50%;
      background:#facc15; box-shadow:0 0 15px 5px rgba(250,202,21,.6),0 0 30px 10px rgba(250,202,21,.4); z-index:15; }
    /* Stars */
    .star-container{position:absolute; top:0; left:0; width:100%; height:40%; overflow:hidden; pointer-events:none;}
    .star{position:absolute; background:#fff; border-radius:50%; opacity:0; box-shadow:0 0 1px .5px rgba(255,255,255,.7); animation:twinkle linear infinite; z-index:10;}
    @keyframes twinkle{0%,100%{opacity:.8; transform:scale(1);}50%{opacity:.2; transform:scale(.5);}}
    /* Water wave overlay */
    .krathong-scene::after{
      content:''; position:absolute; bottom:0; left:0; right:0; height:70%;
      background: linear-gradient(180deg, rgba(30,58,95,0.0) 0%, rgba(0,0,0,0.4) 15%, rgba(30,58,95,0.2) 35%, rgba(0,0,0,0.4) 55%, rgba(30,58,95,0.2) 75%, rgba(0,0,0,0.4) 95%);
      background-size:100% 600px; animation:waveFlow 40s linear infinite; opacity:.7; z-index:0;
    }
    @keyframes waveFlow{from{background-position:0% 100%;}to{background-position:0% 0%;}}
    /* Krathong */
    .floating-krathong-item{ position:absolute; cursor:pointer; transition:all .5s ease-out; z-index:20; font-size: clamp(1.75rem, 4vw, 3rem); line-height:1; }

    /* --- อนิเมชันใหม่: กระทงลอยตามน้ำ --- */
    @keyframes riverFlow {
      0% { transform: translateX(-50%) translateY(150px) scale(0.7); opacity: 0; }
      20% { opacity: 1; }
      90% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
      100% { transform: translateX(-50%) translateY(-20px) scale(1.05); opacity: 0; }
    }
    .krathong-flow { animation: riverFlow 30s linear infinite; }

    /* Animation สำหรับกระทงล่าสุดที่ปรากฏขึ้น */
    @keyframes appear {
      from { opacity: 0; transform: translateX(-50%) scale(0.5); }
      to { opacity: 1; transform: translateX(-50%) scale(1.2); }
    }
    .krathong-appear { animation: appear 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    /* Bubble */
    .speech-bubble {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      margin-bottom: 12px; min-width: 110px; max-width: 180px; font-size: .75rem;
      background-color: rgba(255, 255, 255, .95); color: #1e293b; text-align: center;
      padding: 6px 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0, 0, 0, .4); z-index: 50;
    }
    .speech-bubble::after {
      content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      border-width: 8px 8px 0 8px; border-style: solid; border-color: rgba(255, 255, 255, .95) transparent transparent transparent;
    }
    /* Selector highlight */
    .krathong-select-button:checked + label{ border-color:#facc15; background-color:#4c515a33; box-shadow:0 0 10px rgba(250,202,21,.5); }

    .krathong-logo-block { gap: 0.5rem; }
    .krathong-header-title { letter-spacing: 0.08em; }
    @media (max-width: 640px) {
      .krathong-logo-block {
        position: static !important;
        justify-content: center;
        padding: 0.5rem 0;
      }
      .krathong-logo-block + .krathong-logo-block {
        margin-top: 0.25rem;
      }
      .krathong-header-title {
        letter-spacing: 0.06em;
      }
      .speech-bubble {
        max-width: 70vw;
      }
      /* No longer need to override bubble position on mobile */
      .moon {
        width: 44px;
        height: 44px;
        right: 10%;
      }
    }

  </style>
</head>
<body class="bg-water-dark min-h-screen font-sans text-white antialiased p-4 sm:p-6">

  <!-- Feedback -->
  <div id="feedback-box" class="fixed top-5 left-1/2 -translate-x-1/2 hidden p-3 sm:p-4 rounded-lg shadow-2xl text-white font-semibold z-[100] transition-all duration-300 w-[calc(100%-2rem)] max-w-md text-center text-sm sm:text-base"></div>

  <div class="max-w-4xl mx-auto py-6 sm:py-10">
    <header class="krathong-header text-center mb-10 sm:mb-12 pt-6 sm:pt-24">
      <div class="krathong-logo-block absolute top-0 left-0 flex items-center gap-2 sm:gap-3 p-2">
      <img src="logo01.png" alt="Logo 01" class="krathong-logo h-14 sm:h-20 w-auto object-contain" />
      </div>
      <div class="krathong-logo-block absolute top-0 right-0 flex items-center gap-2 sm:gap-3 p-2">
      <img src="logo02.png" alt="Logo 02" class="krathong-logo h-14 sm:h-20 w-auto object-contain" />
      <img src="logo03.png" alt="Logo 03" class="krathong-logo h-14 sm:h-20 w-auto object-contain" />
      </div>

      <!-- Title -->
      <h1 class="krathong-header-title text-3xl sm:text-5xl font-extrabold text-gray-200 drop-shadow-lg tracking-wide sm:tracking-wider leading-snug sm:leading-tight">
      สืบสานวัฒนธรรม ลอยกระทง รักษ์โลก ๒๕๖๘ 🌕
      </h1>
      <p class="text-base sm:text-xl text-gray-300 mt-3">ร่วมอธิษฐานและลอยกระทงไปกับทุกคน อัปเดตทุกประมาณ 1 นาที</p>
    </header>

    <!-- Scene -->
    <div class="bg-water-dark p-2 rounded-2xl shadow-xl border border-water-light/50 mb-3 relative">
      <h2 class="text-3xl font-bold mb-4 text-center text-gray-400 pt-4">ผืนน้ำแห่งคำอธิษฐาน</h2>
      <div class="flex flex-col gap-1 sm:flex-row sm:items-center sm:justify-end text-xs sm:text-sm text-gray-400 mb-2 px-4">
        <span id="loading-status">กำลังเชื่อมต่อฐานข้อมูล...</span>
      </div>

      <div id="krathong-list" class="krathong-scene relative w-full">
        <div id="star-container" class="star-container"></div>
        <div class="moon"></div>
        <div class="text-center p-6 sm:p-8 text-gray-400 text-sm sm:text-base absolute inset-0 flex items-center justify-center">กำลังโหลดกระทง...</div>
      </div>
      <div class="px-4 py-2 text-right text-[0.7rem] sm:text-xs text-gray-400">
        อัปเดตล่าสุดเมื่อ <span id="last-updated">—</span>
      </div>
    </div>

    <!-- Float button -->
    <div class="text-center mt-4">
      <button onclick="toggleFloatModal(true)"
        class="px-6 sm:px-8 py-3 sm:py-4 bg-gray-300 text-water-dark font-extrabold text-base sm:text-lg rounded-full shadow-2xl hover:bg-gray-400 transition-all duration-300 transform hover:scale-105 active:scale-95">
        คลิกเพื่อ ลอยกระทง 🚀
      </button>
    </div>
  </div>

  <!-- Modal -->
  <div id="float-modal" class="fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center p-4 hidden z-50">
    <div class="bg-water-light p-6 sm:p-8 rounded-2xl shadow-2xl max-w-lg w-full transform transition-all duration-300 border-2 border-moon-gold/50">
      <h3 class="text-2xl sm:text-3xl font-bold text-moon-gold mb-6 text-center">ลอยกระทงของคุณ 🌙</h3>
      <form id="krathong-form" onsubmit="event.preventDefault(); floatKrathong();">
        <div class="mb-4">
          <label for="full-name" class="block text-xs sm:text-sm font-medium text-gray-300 mb-1">ชื่อ-นามสกุล (สำหรับแสดงผล)</label>
          <input type="text" id="full-name" required maxlength="100" class="w-full p-2.5 sm:p-3 rounded-lg bg-water-dark border border-gray-600 focus:border-lotus-pink focus:ring-1 focus:ring-lotus-pink text-white text-sm sm:text-base" placeholder="เช่น: ดวงจันทร์ ลอยน้ำ">
        </div>
        <div class="mb-4">
          <label for="wish" class="block text-xs sm:text-sm font-medium text-gray-300 mb-1">คำอธิษฐาน/คำอวยพร</label>
          <textarea id="wish" rows="3" required maxlength="100" class="w-full p-2.5 sm:p-3 rounded-lg bg-water-dark border border-gray-600 focus:border-lotus-pink focus:ring-1 focus:ring-lotus-pink text-white text-sm sm:text-base" placeholder="เช่น: ขอให้ครอบครัวมีความสุข สุขภาพแข็งแรง ตลอดปี"></textarea>
        </div>

        <!-- Selector -->
        <div class="mb-6">
          <label class="block text-xs sm:text-sm font-medium text-gray-300 mb-2">เลือกกระทง</label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <!-- Banana Leaf -->
            <div>
              <input type="radio" id="krathong-banana-leaf" name="krathongType" value="BananaLeaf" class="hidden krathong-select-button" required>
              <label for="krathong-banana-leaf" class="krathong-select-button block p-3 sm:p-4 rounded-xl text-center cursor-pointer border-2 border-gray-600 transition-all duration-200">
                <div class="mx-auto w-12 h-12">
                  <svg viewBox="0 0 48 48" class="w-12 h-12 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M40 24C40 33.9411 31.9411 42 22 42C12.0589 42 4 33.9411 4 24C4 14.0589 12.0589 6 22 6C31.9411 6 40 14.0589 40 24Z" fill="#38A169" opacity="0.8"/>
                    <path d="M40 24C40 30 35 34 24 34H20C9 34 4 30 4 24" fill="#68D391" opacity="0.6"/>
                    <rect x="22" y="16" width="4" height="12" rx="2" fill="#9F7A3E"/>
                    <path d="M24 10C24 8 26 8 26 10C26 12 24 14 24 14C24 14 22 12 22 10C22 8 24 8 24 10Z" fill="#FDE68A"/>
                    <path d="M24 10C24 9 25 9 25 10C25 11 24 12 24 12C24 12 23 11 23 10C23 9 24 9 24 10Z" fill="#F6AD55"/>
                    <rect x="27" y="24" width="2" height="6" rx="1" fill="#4A5568"/>
                    <rect x="19" y="24" width="2" height="6" rx="1" fill="#4A5568"/>
                  </svg>
                </div>
                <span class="text-sm mt-1 block">ใบตอง</span>
              </label>
            </div>
            <!-- Lotus -->
            <div>
              <input type="radio" id="krathong-lotus" name="krathongType" value="Lotus" class="hidden krathong-select-button">
              <label for="krathong-lotus" class="krathong-select-button block p-3 sm:p-4 rounded-xl text-center cursor-pointer border-2 border-gray-600 transition-all duration-200">
                <div class="mx-auto w-12 h-12">
                  <svg viewBox="0 0 48 48" class="w-12 h-12 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 42C30 42 38 38 42 32C46 26 44 18 36 18C36 18 30 14 24 14C18 14 12 18 12 18C4 18 2 26 6 32C10 38 18 42 24 42Z" fill="#EC4899" opacity="0.7"/>
                    <path d="M24 14L28 26H20L24 14Z" fill="#F9A8D4"/>

                    <path d="M36 18L30 30L42 32L36 18Z" fill="#F9A8D4"/><rect x="22" y="18" width="4" height="10" rx="2" fill="#FBBF24"/>
                    <path d="M24 12C24 10 26 10 26 12C26 14 24 16 24 16C24 16 22 14 22 12C22 10 24 10 24 12Z" fill="#FDE68A"/>
                    <rect x="27" y="26" width="2" height="4" rx="1" fill="#4A5568"/>
                    <rect x="19" y="26" width="2" height="4" rx="1" fill="#4A5568"/>
                  </svg>
                </div>
                <span class="text-sm mt-1 block">ดอกบัว</span>
              </label>
            </div>
            <!-- Classic -->
            <div>
              <input type="radio" id="krathong-classic" name="krathongType" value="Classic" class="hidden krathong-select-button" checked>
              <label for="krathong-classic" class="krathong-select-button block p-3 sm:p-4 rounded-xl text-center cursor-pointer border-2 border-gray-600 transition-all duration-200">
                <div class="mx-auto w-12 h-12">
                  <svg viewBox="0 0 48 48" class="w-12 h-12 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="24" cy="40" r="10" fill="#9F7A3E"/>
                    <path d="M34 35C34 37 32 37 24 37C16 37 14 37 14 35C14 33 24 25 24 25C24 25 34 33 34 35Z" fill="#A0AEC0"/>
                    <path d="M24 20C28 20 30 24 30 26C30 28 24 30 24 30C24 30 18 28 18 26C18 24 20 20 24 20Z" fill="#38A169"/>
                    <rect x="22" y="12" width="4" height="10" rx="2" fill="#FFFFFF"/>
                    <path d="M24 8C24 6 26 6 26 8C26 10 24 12 24 12C24 12 22 10 22 8C22 6 24 6 24 8Z" fill="#FDE68A"/>

            <!-- Coconut -->
            <div>
              <input type="radio" id="krathong-coconut" name="krathongType" value="Coconut" class="hidden krathong-select-button">
              <label for="krathong-coconut" class="krathong-select-button block p-3 sm:p-4 rounded-xl text-center cursor-pointer border-2 border-gray-600 transition-all duration-200">
                <div class="mx-auto w-12 h-12">
                  <svg viewBox="0 0 48 48" class="w-12 h-12 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M40 28C40 35.732 32.8366 42 24 42C15.1634 42 8 35.732 8 28H40Z" fill="#78350F"/>
                    <path d="M24 26C27.3137 26 30 23.3137 30 20C30 16.6863 27.3137 14 24 14C20.6863 14 18 16.6863 18 20C18 23.3137 20.6863 26 24 26Z" fill="#FBBF24"/>
                    <rect x="22" y="10" width="4" height="10" rx="2" fill="#FFFFFF"/>
                    <path d="M24 6C24 4 26 4 26 6C26 8 24 10 24 10C24 10 22 8 22 6C22 4 24 4 24 6Z" fill="#FDE68A"/>
                    <rect x="27" y="18" width="2" height="4" rx="1" fill="#4A5568"/>
                    <rect x="19" y="18" width="2" height="4" rx="1" fill="#4A5568"/>
                  </svg>
                </div>
                <span class="text-sm mt-1 block">กะลามะพร้าว</span>
              </label>
            </div>
          </div>
        </div>

        <div class="flex justify-end space-x-3">
          <button type="button" onclick="toggleFloatModal(false)" class="px-4 sm:px-5 py-2 border border-gray-600 text-gray-300 text-sm sm:text-base rounded-lg hover:bg-gray-700 transition-colors">ยกเลิก</button>
          <button type="submit" id="float-button" class="px-4 sm:px-5 py-2 bg-lotus-pink text-white font-semibold text-sm sm:text-base rounded-lg hover:bg-pink-600 transition-colors disabled:bg-gray-500">ลอยกระทง</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Cloudflare D1 + Workers -->
  <script type="module">
    const API_BASE = 'https://krathong-api.teerapat-dev29.workers.dev';
    const REFRESH_MS = 60000;
    const API_TIMEOUT_MS = 12000;
    const DISPLAY_LIMIT = window.innerWidth <= 640 ? 20 : 30;

    // --- Icons (SVG) ---
    window.KRATHONG_ICONS = {
      'BananaLeaf': `<svg viewBox="0 0 48 48" class="w-12 h-12 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M40 24C40 33.9411 31.9411 42 22 42C12.0589 42 4 33.9411 4 24C4 14.0589 12.0589 6 22 6C31.9411 6 40 14.0589 40 24Z" fill="#38A169" opacity="0.8"/><path d="M40 24C40 30 35 34 24 34H20C9 34 4 30 4 24" fill="#68D391" opacity="0.6"/><rect x="22" y="16" width="4" height="12" rx="2" fill="#9F7A3E"/><path d="M24 10C24 8 26 8 26 10C26 12 24 14 24 14C24 14 22 12 22 10C22 8 24 8 24 10Z" fill="#FDE68A"/><path d="M24 10C24 9 25 9 25 10C25 11 24 12 24 12C24 12 23 11 23 10C23 9 24 9 24 10Z" fill="#F6AD55"/><rect x="27" y="24" width="2" height="6" rx="1" fill="#4A5568"/><rect x="19" y="24" width="2" height="6" rx="1" fill="#4A5568"/></svg>`,
      'Lotus': `<svg viewBox="0 0 48 48" class="w-12 h-12 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M24 42C30 42 38 38 42 32C46 26 44 18 36 18C36 18 30 14 24 14C18 14 12 18 12 18C4 18 2 26 6 32C10 38 18 42 24 42Z" fill="#EC4899" opacity="0.7"/><path d="M24 14L28 26H20L24 14Z" fill="#F9A8D4"/><path d="M12 18L18 30L6 32L12 18Z" fill="#F9A8D4"/><path d="M36 18L30 30L42 32L36 18Z" fill="#F9A8D4"/><rect x="22" y="18" width="4" height="10" rx="2" fill="#FBBF24"/><path d="M24 12C24 10 26 10 26 12C26 14 24 16 24 16C24 16 22 14 22 12C22 10 24 10 24 12Z" fill="#FDE68A"/><rect x="27" y="26" width="2" height="4" rx="1" fill="#4A5568"/><rect x="19" y="26" width="2" height="4" rx="1" fill="#4A5568"/></svg>`,
      'Classic': `<svg viewBox="0 0 48 48" class="w-12 h-12 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="24" cy="40" r="10" fill="#9F7A3E"/><path d="M34 35C34 37 32 37 24 37C16 37 14 37 14 35C14 33 24 25 24 25C24 25 34 33 34 35Z" fill="#A0AEC0"/><path d="M24 20C28 20 30 24 30 26C30 28 24 30 24 30C24 30 18 28 18 26C18 24 20 20 24 20Z" fill="#38A169"/><rect x="22" y="12" width="4" height="10" rx="2" fill="#FFFFFF"/><path d="M24 8C24 6 26 6 26 8C26 10 24 12 24 12C24 12 22 10 22 8C22 6 24 6 24 8Z" fill="#FDE68A"/><rect x="27" y="18" width="2" height="4" rx="1" fill="#4A5568"/><rect x="19" y="18" width="2" height="4" rx="1" fill="#4A5568"/></svg>`,
      'Coconut': `<svg viewBox="0 0 48 48" class="w-12 h-12 mx-auto" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M40 28C40 35.732 32.8366 42 24 42C15.1634 42 8 35.732 8 28H40Z" fill="#78350F"/><path d="M24 26C27.3137 26 30 23.3137 30 20C30 16.6863 27.3137 14 24 14C20.6863 14 18 16.6863 18 20C18 23.3137 20.6863 26 24 26Z" fill="#FBBF24"/><rect x="22" y="10" width="4" height="10" rx="2" fill="#FFFFFF"/><path d="M24 6C24 4 26 4 26 6C26 8 24 10 24 10C24 10 22 8 22 6C22 4 24 4 24 6Z" fill="#FDE68A"/><rect x="27" y="18" width="2" height="4" rx="1" fill="#4A5568"/><rect x="19" y="18" width="2" height="4" rx="1" fill="#4A5568"/></svg>`
    };

    // --- UI helpers ---
    const showFeedback = (message, type='info') => {
      const box = document.getElementById('feedback-box');
      box.textContent = message;
      box.classList.remove('hidden','bg-red-500','bg-green-500','bg-yellow-500','bg-blue-500');
      const c = {error:'bg-red-500', success:'bg-green-500', warning:'bg-yellow-500', info:'bg-blue-500'};
      box.classList.add(c[type] || 'bg-blue-500');
      setTimeout(()=> box.classList.add('hidden'), 5000);
    };

    const createStars = () => {
      const container = document.getElementById('star-container'); if (!container) return;
      const n = 150;
      for (let i=0;i<n;i++){
        const s = document.createElement('div'); s.className = 'star';
        const size = Math.random()*1 + 1;
        s.style.width = size+'px'; s.style.height = size+'px';
        s.style.top = (Math.random()*100)+'%'; s.style.left = (Math.random()*100)+'%';
        s.style.animationDelay = (Math.random()*5)+'s'; s.style.animationDuration = (Math.random()*3+1.5)+'s';
        container.appendChild(s);
      }
    };

    // User-supplied text must not be interpreted as HTML.
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g,
      char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

    // --- Render ---
    // ปรับปรุงให้รับ array ของข้อมูลกระทงที่จัดเรียงแล้ว
    const renderKrathongs = (krathongDataArray) => {
      const list = document.getElementById('krathong-list');
      const moon = document.querySelector('.moon');
      const stars = document.getElementById('star-container');
      list.innerHTML = '';
      if (stars) list.appendChild(stars);
      if (moon) list.appendChild(moon);

      if (krathongDataArray.length === 0) {
        list.innerHTML += '<div class="text-center p-6 sm:p-8 text-gray-400 text-sm sm:text-base absolute inset-0 flex items-center justify-center z-30">ยังไม่มีกระทงลอยอยู่ในลำน้ำนี้เลย! มาเป็นคนแรกลอยกันเถอะ.</div>';
        return;
      }

      let html = '';
      const hashString = (s) => { let h=0; for (let i=0;i<s.length;i++) { h=((h<<5)-h)+s.charCodeAt(i); h|=0; } return Math.abs(h); };

      // วนลูปข้อมูลกระทงที่จัดเรียงแล้ว (forEach มี index ให้ใช้)
      const isMobile = window.innerWidth <= 640;
      krathongDataArray.forEach((d, index) => {
        const icon = window.KRATHONG_ICONS[d.krathongType] || window.KRATHONG_ICONS['Classic'];
        let x, y, zIndex, scale, extraClass = '', transformStyle;

        if (index === 0) {
            // กระทงล่าสุด: จัดให้อยู่ตรงกลาง, ด้านหน้าสุด และใหญ่กว่า
            x = isMobile ? 50 : 45; // มือถือ: กลางจอ, เดสก์ท็อป: ขยับซ้าย
            y = 70; // ปรับตำแหน่งเริ่มต้นให้อยู่ด้านหน้า
            zIndex = 30; // z-index สูงสุด
            scale = 1.0;
            extraClass = 'krathong-flow'; // เปลี่ยนมาใช้อนิเมชันลอยตามน้ำเหมือนกระทงอื่น
            transformStyle = `transform: translateX(-50%);`; // จัดกึ่งกลาง
        } else {
            // กระทงอื่นๆ: จัดวางแบบสุ่มโดยแหวกตรงกลาง (แยกตามขนาดจอ)
            const h = hashString(d.id || d.userId);
            if (isMobile) {
              // --- ตรรกะสำหรับมือถือ ---
              if (h % 2 === 0) {
                // ฝั่งซ้าย: 5% - 40%
                x = 5 + (h % 35);
              } else {
                // ฝั่งขวา: 60% - 95%
                x = 60 + (h % 35);
              }
            } else {
              // --- ตรรกะสำหรับเดสก์ท็อป (เหมือนเดิม) ---
              if (h % 2 === 0) {
                // ฝั่งซ้าย: 5% - 35%
                x = 5 + (h % 30);
              } else {
                // ฝั่งขวา: 55% - 85%
                x = 55 + (h % 30);
              }
            }

            y = 40 + ((h >> 8) % 50); // 40-90%
            zIndex = 20; // z-index ปกติ
            scale = 1.0;
            extraClass = 'krathong-flow'; // ใช้อนิเมชันลอยตามน้ำ
            transformStyle = `transform: translateX(-50%);`; // Scale ถูกควบคุมโดย animation แล้ว
        }

        // สุ่ม delay เพื่อให้กระทงแต่ละอันเริ่มลอยไม่พร้อมกัน
        // สำหรับกระทงล่าสุด (index=0) ให้เริ่มทันที ไม่ต้อง delay
        const animDelay = (index === 0) ? 0 : (hashString(d.id || d.userId) % 30000) / 1000;

        html += `
          <div class="floating-krathong-item ${extraClass}" style="left:${x}%; top:${y}%; z-index:${zIndex}; ${transformStyle} animation-delay: -${animDelay}s; --start-y: ${y}%; --start-x: ${x}%;">
            <div class="leading-none">${icon}</div>
            <div class="speech-bubble">
              <p class="text-xs font-bold truncate">${escapeHtml(d.name || 'ผู้ลอยนิรนาม')}</p>
              <p class="text-[0.65rem] italic text-gray-700 leading-tight mt-0.5 max-h-8 overflow-hidden">"${escapeHtml(d.wish || 'ขอให้มีความสุข')}"</p>
            </div>
          </div>`;
      });
      list.insertAdjacentHTML('beforeend', html);
    };

    // --- Last updated label ---
    const setLastUpdated = () => {
      const pad = (n) => n.toString().padStart(2,'0');
      const now = new Date();
      const t = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById('last-updated').textContent = t;
    };

    // --- D1 API: refresh only while visible, with jitter and failure backoff ---
    let currentKrathongData = [], ownKrathongs = [], refreshTimer = null;
    let loading = false, sending = false, failures = 0, nextRefreshAt = 0;
    let pendingSubmission = null;

    const apiRequest = async (path, options = {}) => {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
      try {
        const response = await fetch(API_BASE + path, {
          ...options, credentials: 'omit', signal: controller.signal
        });
        const text = await response.text();
        let data;
        try { data = JSON.parse(text); }
        catch { throw new Error('API ยังไม่พร้อม กรุณาตรวจสอบการ Deploy Worker'); }
        if (!response.ok) throw new Error(data.error || 'เชื่อมต่อระบบไม่สำเร็จ');
        return data;
      } catch (error) {
        if (error.name === 'AbortError') throw new Error('การเชื่อมต่อใช้เวลานาน กรุณาลองใหม่');
        throw error;
      } finally { clearTimeout(timeout); }
    };

    const renderFeed = () => {
      const merged = new Map(currentKrathongData.map(item => [item.id, item]));
      ownKrathongs.forEach(item => merged.set(item.id, item));
      const items = [...merged.values()].sort((a, b) =>
        b.timestampSeconds - a.timestampSeconds || b.id.localeCompare(a.id)
      ).slice(0, DISPLAY_LIMIT);
      renderKrathongs(items);
    };

    const scheduleRefresh = () => {
      clearTimeout(refreshTimer);
      refreshTimer = null;
      const delay = Math.min(REFRESH_MS * (2 ** failures), 300000) + Math.random() * 10000;
      nextRefreshAt = Date.now() + delay;
      if (!document.hidden) refreshTimer = setTimeout(fetchKrathongsOnce, delay);
    };

    const fetchKrathongsOnce = async () => {
      if (loading || document.hidden) return;
      loading = true;
      try {
        const data = await apiRequest('/api/krathongs');
        if (!Array.isArray(data.krathongs)) throw new Error('ข้อมูลจาก API ไม่ถูกต้อง');
        currentKrathongData = data.krathongs;
        // Keep recent personal submissions visible while the shared feed is cached.
        const receivedIds = new Set(data.krathongs.map(item => item.id));
        ownKrathongs = ownKrathongs.filter(item => !receivedIds.has(item.id));
        renderFeed();
        document.getElementById('loading-status').textContent = 'อัปเดตอัตโนมัติทุกประมาณ 1 นาที';
        const updated = new Date(data.updatedAt);
        document.getElementById('last-updated').textContent = Number.isNaN(updated.getTime())
          ? '—' : updated.toLocaleTimeString('th-TH', { hour12: false });
        failures = 0;
      } catch (error) {
        failures = Math.min(failures + 1, 3);
        document.getElementById('loading-status').textContent = 'เชื่อมต่อไม่สำเร็จ กำลังรอลองใหม่';
        if (!currentKrathongData.length && !ownKrathongs.length) {
          const placeholder = document.querySelector('#krathong-list > .text-center');
          if (placeholder) placeholder.textContent = 'ยังโหลดข้อมูลไม่ได้ ระบบจะลองใหม่อัตโนมัติ';
        }
        if (failures === 1) showFeedback(error.message || 'โหลดข้อมูลไม่สำเร็จ', 'error');
      } finally {
        loading = false;
        scheduleRefresh();
      }
    };

    window.floatKrathong = async () => {
      if (sending) return;
      const form = document.getElementById('krathong-form');
      if (!form.reportValidity()) return;
      const name = document.getElementById('full-name').value.trim();
      const wish = document.getElementById('wish').value.trim();
      const krathongType = document.querySelector('input[name="krathongType"]:checked')?.value;
      if (!name || !wish || !krathongType) {
        return showFeedback('กรุณากรอกข้อมูลให้ครบถ้วนและเลือกกระทง', 'warning');
      }
      const signature = JSON.stringify({ name, wish, krathongType });
      // Retain the ID if the connection failed after the server saved the data.
      if (!pendingSubmission || pendingSubmission.signature !== signature) {
        pendingSubmission = { signature, id: crypto.randomUUID() };
      }
      sending = true;
      const btn = document.getElementById('float-button');
      btn.disabled = true;
      btn.textContent = 'กำลังลอยกระทง...';
      try {
        const data = await apiRequest('/api/krathongs', {
          method: 'POST',
          // A simple CORS request avoids a preflight for every submission.
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify({ id: pendingSubmission.id, name, wish, krathongType })
        });
        if (!data.krathong?.id) throw new Error('API ไม่ได้ยืนยันการบันทึก กรุณาลองใหม่');
        ownKrathongs = [data.krathong, ...ownKrathongs.filter(item => item.id !== data.krathong.id)].slice(0, 5);
        renderFeed();
        setLastUpdated();
        form.reset();
        pendingSubmission = null;
        sending = false;
        toggleFloatModal(false);
        showFeedback('ลอยกระทงสำเร็จแล้ว! 🎉', 'success');
        // No immediate GET: the POST response already contains the saved item.
      } catch (error) {
        showFeedback(error.message || 'บันทึกไม่สำเร็จ กรุณาลองใหม่', 'error');
      } finally {
        sending = false;
        btn.disabled = false;
        btn.textContent = 'ลอยกระทง';
      }
    };

    window.toggleFloatModal = (show) => {
      const modal = document.getElementById('float-modal');
      if (!show && sending) return;
      modal.classList.toggle('hidden', !show);
      document.body.classList.toggle('overflow-hidden', show);
    };

    const init = () => {
      fetchKrathongsOnce();
      document.addEventListener('visibilitychange', () => {
        clearTimeout(refreshTimer);
        if (document.hidden || loading) return;
        const remaining = Math.max(0, nextRefreshAt - Date.now());
        refreshTimer = setTimeout(fetchKrathongsOnce, remaining + Math.random() * 3000);
      });
      window.addEventListener('online', () => {
        // Do not bypass the next scheduled refresh on repeated online events.
        if (!document.hidden && !loading && Date.now() >= nextRefreshAt) fetchKrathongsOnce();
      });
    };

    document.addEventListener('DOMContentLoaded', () => {
      createStars();
      init();
    });
  </script>
</body>
</html>
